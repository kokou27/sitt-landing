<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Recover my code — SITT</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%238b7aff'/><stop offset='100%25' stop-color='%236fd3c8'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><text x='32' y='44' font-family='Georgia,serif' font-size='22' font-weight='bold' fill='white' text-anchor='middle' letter-spacing='1'>SITT</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #161616;
      --border: rgba(255, 255, 255, 0.07);
      --border-h: rgba(255, 255, 255, 0.14);
      --text: #f0ede8;
      --muted: #888880;
      --accent: #c8b89a;
      --accent-dim: rgba(200, 184, 154, 0.10);
      --pro: #8b7aff;
      --pro-end: #6fd3c8;
      --pro-border: rgba(139, 122, 255, 0.2);
      --red: #ff9f9f;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 3rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(14px);
    }

    .nav-logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; }
    .nav-logo-icon {
      width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(135deg, var(--pro), var(--pro-end));
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Serif Display', serif; font-size: 0.7rem; color: white; font-weight: bold; letter-spacing: 0.05em;
    }
    .nav-logo-name { font-family: 'DM Serif Display', serif; font-size: 1.05rem; color: var(--text); }
    .nav-logo-name span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .lang-btn {
      background: none; border: none; cursor: pointer; padding: 0.3rem 0.7rem;
      font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.05em;
      color: var(--muted); transition: all 0.18s;
    }
    .lang-btn.active { background: var(--accent-dim); color: var(--accent); }
    .nav-back { font-size: 0.82rem; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .nav-back:hover { color: var(--text); }

    main {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 9rem 1.5rem 4rem;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.75rem 2.25rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--pro), var(--pro-end), transparent);
    }

    h1 { font-family: 'DM Serif Display', serif; font-size: 1.6rem; margin-bottom: 0.6rem; letter-spacing: -0.015em; text-align: center; }
    p.sub { color: var(--muted); font-size: 0.875rem; font-weight: 300; margin-bottom: 2rem; text-align: center; }

    .form-field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.1rem; }
    .form-label {
      font-size: 0.7rem; font-weight: 500; color: var(--muted);
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .form-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.82rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      width: 100%;
    }
    .form-input::placeholder { color: var(--muted); opacity: 0.4; }
    .form-input:focus { border-color: var(--pro-border); box-shadow: 0 0 0 3px rgba(139, 122, 255, 0.07); }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--pro), var(--pro-end));
      color: white;
      border: none;
      padding: 0.85rem 1.6rem;
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    .result { margin-top: 1.5rem; font-size: 0.875rem; text-align: center; }
    .code-box {
      margin-top: 0.75rem;
      background: var(--surface-2);
      border: 1px dashed var(--border-h);
      border-radius: 10px;
      padding: 1rem;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      word-break: break-all;
      color: var(--accent);
    }
    .copy-btn {
      margin-top: 0.75rem;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-h);
      border-radius: 999px;
      padding: 0.5rem 1.1rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .muted-text { color: var(--muted); font-weight: 300; }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 3rem;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    }
    .footer-logo { display: flex; align-items: center; gap: 0.5rem; font-family: 'DM Serif Display', serif; font-size: 0.9rem; color: var(--muted); }
    .footer-logo-icon {
      width: 20px; height: 20px; border-radius: 5px;
      background: linear-gradient(135deg, var(--pro), var(--pro-end));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.48rem; font-weight: bold; color: white; font-family: 'DM Serif Display', serif;
    }
    .footer-logo span { color: var(--accent); }
    .footer-copy { font-size: 0.72rem; color: rgba(255, 255, 255, 0.18); }

    [data-lang] { display: none; }
    .lang-en [data-lang="en"] { display: block; }
    .lang-fr [data-lang="fr"] { display: block; }
    span[data-lang] { display: none; }
    .lang-en span[data-lang="en"] { display: inline; }
    .lang-fr span[data-lang="fr"] { display: inline; }
  </style>
</head>

<body class="lang-en">

  <nav>
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">SITT</div>
      <span class="nav-logo-name">SITT<span>.</span></span>
    </a>
    <div class="nav-right">
      <a href="/" class="nav-back">
        <span data-lang="en">← Home</span>
        <span data-lang="fr">← Accueil</span>
      </a>
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('fr')">FR</button>
      </div>
    </div>
  </nav>

  <main>
    <div class="card">
      <h1 data-lang="en">Recover my code</h1>
      <h1 data-lang="fr">Retrouver mon code</h1>
      <p class="sub" data-lang="en">Enter the email you used at checkout.</p>
      <p class="sub" data-lang="fr">Entrez l'email utilisé lors de votre achat.</p>

      <form id="recover-form">
        <div class="form-field">
          <label class="form-label" for="email-input">
            <span data-lang="en">Email</span>
            <span data-lang="fr">Email</span>
          </label>
          <input type="email" id="email-input" class="form-input" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn" id="submit-btn">
          <span data-lang="en">Recover my code</span>
          <span data-lang="fr">Retrouver mon code</span>
        </button>
      </form>

      <div id="result" class="result"></div>
    </div>
  </main>

  <footer>
    <div class="footer-logo">
      <div class="footer-logo-icon">SITT</div>
      Screen &amp; Image Text Tool<span>.</span>
    </div>
    <div class="footer-copy">© 2025-2026 SITT · Rouff Design</div>
  </footer>

  <script>
    function setLang(lang) {
      document.body.className = 'lang-' + lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === lang);
      });
    }

    (function () {
      const BACKEND_URL = 'https://backend.sitt.workers.dev';
      const form = document.getElementById('recover-form');
      const emailInput = document.getElementById('email-input');
      const submitBtn = document.getElementById('submit-btn');
      const resultEl = document.getElementById('result');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const isEn = !document.body.classList.contains('lang-fr');
        submitBtn.disabled = true;
        submitBtn.textContent = isEn ? 'Searching…' : 'Recherche…';
        resultEl.innerHTML = '';

        try {
          const res = await fetch(`${BACKEND_URL}/api/recover-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailInput.value.trim() }),
          });
          const data = await res.json();

          if (data.found && data.code) {
            resultEl.innerHTML = `
              <div class="code-box">${data.code}</div>
              <button class="copy-btn" id="copy-btn">${isEn ? 'Copy' : 'Copier'}</button>
              <p class="muted-text" style="margin-top:0.9rem;">
                ${isEn
                ? 'Enter this code in the SITT extension → Settings → "Activate my code".'
                : 'Entrez ce code dans l\'extension SITT → Paramètres → "Activer mon code".'}
              </p>
            `;
            document.getElementById('copy-btn').addEventListener('click', () => {
              navigator.clipboard.writeText(data.code);
            });
          } else {
            resultEl.innerHTML = `<p class="muted-text">${data.message || (isEn ? 'No code found for this email.' : 'Aucun code trouvé pour cet email.')}</p>`;
          }
        } catch (err) {
          const isEn2 = !document.body.classList.contains('lang-fr');
          resultEl.innerHTML = `<p class="muted-text">${isEn2 ? 'Network error, please try again.' : 'Erreur réseau, réessayez.'}</p>`;
        } finally {
          submitBtn.disabled = false;
          const isEn3 = !document.body.classList.contains('lang-fr');
          submitBtn.textContent = isEn3 ? 'Recover my code' : 'Retrouver mon code';
        }
      });
    })();
  </script>
</body>

</html>
